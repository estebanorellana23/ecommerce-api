services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      REPO_BACKEND: sql
      DATABASE_URL: postgresql+psycopg://ecommerce:ecommerce@db:5432/ecommerce
      PAYMENT_PROVIDER: visanet
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
